name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/react
            p/node

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./ # Memindai seluruh working directory
          extra_args: --fail --only-verified # Menghapus --fail-on-hardcoded-secrets

      - name: Build API Server Docker image
        run: docker build -t aisecpipeline-api:latest -f docker/Dockerfile.api .

      - name: Build Dashboard Docker image
        run: docker build -t aisecpipeline-dashboard:latest -f docker/Dockerfile.frontend .

      - name: Run Trivy vulnerability scan (API Server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aisecpipeline-api:latest' # Nama image yang sudah di-build sebelumnya
          format: 'table'
          output: 'trivy-api-server-report.txt'
          exit-code: '1' # Gagal jika ditemukan kerentanan kritis/high
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy API Server report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-api-server-report
          path: trivy-api-server-report.txt

      - name: Run Trivy vulnerability scan (Dashboard)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aisecpipeline-dashboard:latest' # Nama image yang sudah di-build sebelumnya
          format: 'table'
          output: 'trivy-dashboard-report.txt'
          exit-code: '1' # Gagal jika ditemukan kerentanan kritis/high
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Dashboard report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dashboard-report
          path: trivy-dashboard-report.txt

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: your_docker_username/aisecpipeline-api:latest

      - name: Build and push Dashboard Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: your_docker_username/aisecpipeline-dashboard:latest

  dast:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Start application
        run: docker-compose up -d

      - name: Wait for services
        run: sleep 30

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html